name: Release compliance

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  asset-inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify asset inventory and hashes
        run: python3 tools/check_release_compliance.py

  public-binary-release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce public release evidence
        run: python3 tools/check_release_compliance.py --release --runtime-manifest dist/qt-runtime-manifest.txt
